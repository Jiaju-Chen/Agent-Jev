name: CPU tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - name: Verify pure CPU dependency imports
        run: |
          python - <<'PYTHON'
          import torch, transformers
          print("torch:", torch.__version__, "compiled CUDA:", torch.version.cuda)
          print("transformers:", transformers.__version__)
          assert torch.version.cuda is None, "CI must exercise a true CPU wheel"
          from transformers import GPT2LMHeadModel, LlamaForCausalLM
          print("CPU model imports passed")
          PYTHON
      - run: python -m unittest discover -s tests -v
      - run: python examples/cpu_smoke.py --out "$RUNNER_TEMP/agent-jev-smoke"
      - run: python tools/verify_release.py --out "$RUNNER_TEMP/agent-jev-training-check"
